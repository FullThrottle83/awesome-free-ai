name: Report an outdated listing
description: Report changed pricing, limits, license claims, or broken links
title: "Update: "
body:
  - type: input
    id: tool
    attributes:
      label: Tool name and link
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should be corrected?
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Official source URL
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date checked (YYYY-MM-DD)
    validations:
      required: true
